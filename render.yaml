# Render Blueprint: one free web service built from ./Dockerfile (web app + API in one container).
# Render redeploys only after the CI checks on `main` pass (autoDeployTrigger: checksPass).
databases:
  # Free Postgres. Render deletes a free database 30 days after creation (14-day grace to upgrade):
  # export what you need or move to a paid plan before then. See docs/adr/006-accounts-and-database.md.
  - name: meoi-db
    plan: free
    region: singapore
    databaseName: meoi

services:
  - type: web
    name: meoi
    runtime: docker
    plan: free
    region: singapore # closest region to Vietnam; cannot be changed after creation
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meoi-db
          property: connectionString
      # Signs login sessions. Generated once by Render and never stored in this repo.
      - key: JWT_SECRET
        generateValue: true
      # Asked for once when the Blueprint is created; never stored in this repo.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Changing the model means re-running the 7 tier evals (CLAUDE.md).
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
