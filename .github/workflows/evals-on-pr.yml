name: Tier evals on sensitive PRs

# Lane C changes (safety keywords, fixed scripts, prompt, model, medical content) must be judged by Vân.
# This workflow always reminds the reviewer, and runs the 7 tier evals on the real model when the secret
# ANTHROPIC_API_KEY and the repository variable ANTHROPIC_MODEL are set. It is not a required check: it costs
# a few cents and the output is not deterministic, so Vân reads the reports and decides.
on:
  pull_request:
    paths:
      - backend/app/safety.py
      - backend/app/scripts.py
      - backend/app/replies.py
      - backend/app/hours.py
      - backend/app/prompts.py
      - backend/app/prompts/**
      - backend/app/llm.py
      - backend/evals/**
      - backend/tests/data/safety_golden.json
      - render.yaml
      - frontend/src/content.ts

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - name: Lane C reminder
        run: |
          {
            echo "## This pull request changes safety-sensitive files (Lane C)"
            echo "- Only Vân merges it, after reading the eval reports below and marking every case pass."
            echo "- New phrasings go into backend/tests/data/safety_golden.json before the code changes."
            echo "- Record the decision in an ADR."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$ANTHROPIC_MODEL" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Evals skipped: set secret ANTHROPIC_API_KEY and variable ANTHROPIC_MODEL, or run them locally."
            echo "- Evals were **skipped** (secret or variable missing). Run them locally before merging." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - if: steps.cfg.outputs.run == 'true'
        run: pip install -e .
      - name: Full pipeline
        if: steps.cfg.outputs.run == 'true'
        run: python -m evals.run_tier_evals
      - name: LLM only
        if: steps.cfg.outputs.run == 'true'
        run: python -m evals.run_tier_evals --llm-only
      - name: Summary of tiers
        if: steps.cfg.outputs.run == 'true'
        run: |
          {
            echo "### Eval results (model: $ANTHROPIC_MODEL)"
            echo "Full reports are in the artifact \`tier-evals\`. Tiers observed:"
            for f in evals/out/*.md; do
              echo ""; echo "**$(basename "$f")**"; echo '```'
              grep -E '^## Case|^_tier=' "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.cfg.outputs.run == 'true'
        with:
          name: tier-evals
          path: backend/evals/out/
          if-no-files-found: warn
