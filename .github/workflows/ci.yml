name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # lets you run CI by hand on any branch

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests evals
      - run: ruff format --check app tests evals
      - run: mypy app tests evals
      # The LLM client is mocked in every test: CI never calls the real API and needs no secret.
      - run: pytest -q

  frontend:
    name: Frontend (eslint, tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build # runs tsc --noEmit first

  docker:
    name: Docker images and compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Create .env from the template (no secrets)
        run: cp .env.example .env
      - name: Build images and start the stack
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Smoke test
        run: bash scripts/compose-smoke.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Stop the stack
        if: always()
        run: docker compose down -v
