document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

1.55;opacity:.65;margin-bottom:14px\">Mình không thay thế bác sĩ hay một người thật lắng nghe. Khi cần, mẹ gọi các số dưới đây.<\u002Fdiv>\n      <sc-for list=\"{{ supportContacts }}\" as=\"sc\" hint-placeholder-count=\"5\">\n        <div style=\"background:#fff;border:1px solid {{ sc.bc }};border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px\">\n          <div style=\"flex:1;min-width:0\">\n            <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\"><span style=\"font-size:14.5px;font-weight:600\">{{ sc.name }}<\u002Fspan><sc-if value=\"{{ sc.hasStatus }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:{{ sc.stBg }};color:{{ sc.stFg }}\">{{ sc.status }}<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n            <div style=\"font-size:12px;opacity:.55;margin:2px 0 4px\">{{ sc.hours }}<\u002Fdiv>\n            <div style=\"font-size:13px;line-height:1.5;opacity:.85\">{{ sc.when }}<\u002Fdiv>\n            <sc-if value=\"{{ sc.hasNote }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12.5px;line-height:1.5;color:#B3261E;margin-top:6px\">{{ sc.note }}<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n          <a href=\"{{ sc.href }}\" style=\"flex:none;background:{{ sc.btnBg }};color:#fff;border-radius:999px;padding:10px 16px;font-size:13.5px;font-weight:600;text-decoration:none;white-space:nowrap\">{{ sc.call }}<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <sc-if value=\"{{ noTrusted }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#F4F7F9;border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px\">\n          <div style=\"flex:1;min-width:0\"><div style=\"font-size:14.5px;font-weight:600;margin-bottom:2px\">Người thân tin cậy<\u002Fdiv><div style=\"font-size:13px;line-height:1.5;opacity:.75\">Mẹ chưa thêm ai. Mẹ thêm ở phần \"Liên hệ tin cậy khẩn cấp\" bên dưới để có một người để gọi khi cần.<\u002Fdiv><\u002Fdiv>\n          \n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"background:#FBEEF2;border-radius:16px;padding:16px 18px;margin-top:6px\">\n        <div style=\"font-size:13.5px;font-weight:600;margin-bottom:10px\">Khi nào cần đi khám hoặc gọi ngay<\u002Fdiv>\n        <div style=\"font-size:12px;font-weight:600;color:#C81E5C;margin-bottom:3px\">Với mẹ<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.55;margin-bottom:10px\">Ra máu nhiều, sốt, vết khâu có dấu hiệu nhiễm trùng, ngực sưng đỏ đau kèm sốt.<\u002Fdiv>\n        <div style=\"font-size:12px;font-weight:600;color:#0B6E99;margin-bottom:3px\">Với bé<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.55;margin-bottom:10px\">Sốt trên 38°C khi dưới 3 tháng tuổi, bú kém hoặc bỏ bú, thở nhanh hoặc khó thở, ngủ li bì bất thường, máu trong phân.<\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.5;opacity:.6\">Gặp một trong các dấu hiệu này, mẹ đi khám ngay hoặc gọi 115 nếu khẩn cấp. Mình không chẩn đoán.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:'Fraunces',serif;font-style:italic;font-size:18px;font-weight:500;margin:26px 0 0\">Thông tin của mẹ<\u002Fdiv>\n      <div style=\"font-size:12.5px;opacity:.55;margin:14px 0 8px\">{{ prParQ }}<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:8px\"><sc-for list=\"{{ prPar }}\" as=\"p\" hint-placeholder-count=\"3\"><button disabled=\"{{ p.dis }}\" sc-camel-on-click=\"{{ p.onClick }}\" style=\"width:100%;border:1.5px solid {{ p.bc }};box-shadow:{{ p.sh }};background:{{ p.tint }};border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13.5px;line-height:1.3;color:#2D2A2E;min-height:52px;cursor:{{ p.cur }};text-align:center;opacity:{{ p.op }};transition:opacity .2s ease\"><span>{{ p.label }}<\u002Fspan><\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n      <div st ;transform:translateX(-50%);font-size:11px;font-weight:600;color:#C81E5C;pointer-events:none\">Trang chủ<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ safeSpacer }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"flex:none;height:22px;background:transparent\"><\u002Fdiv><\u002Fsc-if>\n  <sc-if value=\"{{ kbOn }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-mouse-down=\"{{ keepFocus }}\" style=\"flex:none;height:250px;background:#D1D4DA;padding:8px 4px 0;display:flex;flex-direction:column;gap:11px;position:relative;z-index:40;animation:meoiRise .28s ease both\">\n    <sc-for list=\"{{ kbRows }}\" as=\"row\" hint-placeholder-count=\"4\">\n      <div style=\"display:flex;gap:6px;padding:0 {{ row.pad }}\">\n        <sc-for list=\"{{ row.keys }}\" as=\"k\" hint-placeholder-count=\"9\">\n          <button sc-camel-on-click=\"{{ k.onClick }}\" style=\"flex:{{ k.flex }};min-width:0;height:42px;border:none;border-radius:6px;background:{{ k.bg }};color:{{ k.color }};font-size:{{ k.fs }};box-shadow:0 1px 0 rgba(0,0,0,.28);cursor:pointer;padding:0\">{{ k.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ dpOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Chọn ngày sinh\" sc-camel-on-click=\"{{ closeDp }}\" style=\"position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(45,42,46,.5);display:flex;align-items:flex-end;z-index:26\">\n    <div sc-camel-on-click=\"{{ stopProp }}\" style=\"width:100%;background:#fff;border-radius:26px 26px 0 0;padding:20px 22px 32px;animation:meoiFade .35s ease both\">\n      <div style=\"font-family:'Fraunces',serif;font-style:italic;font-size:17px;margin-bottom:10px\">Ngày sinh của bé<\u002Fdiv>\n      <div style=\"position:relative;display:flex;gap:4px;margin-bottom:14px\">\n        <div style=\"position:absolute;left:0;right:0;top:80px;height:40px;background:#FCE4EC;border-radius:14px;z-index:0;pointer-events:none\"><\u002Fdiv>\n        <div data-wheel=\"1\" ref=\"{{ dpRefD }}\" sc-camel-on-scroll=\"{{ dpScrollD }}\" style=\"flex:.8;height:200px;overflow-y:auto;scroll-snap-type:y mandatory;padding:80px 0;position:relative;z-index:1;scrollbar-width:none\"><sc-for list=\"{{ dpDays }}\" as=\"x\" hint-placeholder-count=\"5\"><div sc-camel-on-click=\"{{ x.onClick }}\" style=\"height:40px;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:{{ x.fw }};opacity:{{ x.op }};cursor:pointer;color:#2D2A2E\">{{ x.label }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv><div data-wheel=\"1\" ref=\"{{ dpRefM }}\" sc-camel-on-scroll=\"{{ dpScrollM }}\" style=\"flex:1.3;height:200px;overflow-y:auto;scroll-snap-type:y mandatory;padding:80px 0;position:relative;z-index:1;scrollbar-width:none\"><sc-for list=\"{{ dpMonths }}\" as=\"x\" hint-placeholder-count=\"5\"><div sc-camel-on-click=\"{{ x.onClick }}\" style=\"height:40px;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:{{ x.fw }};opacity:{{ x.op }};cursor:pointer;color:#2D2A2E\">{{ x.label }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv><div data-wheel=\"1\" ref=\"{{ dpRefY }}\" sc-camel-on-scroll=\"{{ dpScrollY }}\" style=\"flex:1;height:200px;overflow-y:auto;scroll-snap-type:y mandatory;padding:80px 0;position:relative;z-index:1;scrollbar-width:none\"><sc-for list=\"{{ dpYears }}\" as=\"x\" hint-placeholder-count=\"5\"><div sc-camel-on-click=\"{{ x.onClick }}\" style=\"height:40px;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:{{ x.fw }};opacity:{{ x.op }};cursor:pointer;color:#2D2A2E\">{{ x.label }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px\">\n        <button sc-camel-on-click=\"{{ closeDp }}\" style=\"background:none;border:none;color:#2D2A2E;opacity:.55;font-size:14px;cursor:pointer;padding:12px 8px\">Đóng<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ doneDp }}\" style=\"background:#C81E5C;color:#fff;border:none;border-radius:999px;padding:13px 22px;font-weight:600;font-size:15px;cursor:pointer;transition:transform .15s ease, background .15s ease\" style-hover=\"background:#AD1A50;transform:translateY(-1px)\">Xong<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showPrompt }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Gợi ý bổ sung hồ sơ\" style=\"position:absolute;top:0;left:0;right:0;bottom:{{ kbInset }};background:rgba(45,42,46,.5);display:flex;align-items:flex-end;z-index:24\">\n    <div style=\"width:100%;max-height:100%;overflow-y:auto;background:#fff;border-radius:22px 22px 0 0;padding:22px 22px 30px;animation:meoiFade .35s ease both\">\n      <div style=\"font-family:'Fraunces',serif;font-style:italic;font-size:18px;margin-bottom:4px\">Thêm vài điều để mình đồng hành tốt hơn<\u002Fdiv>\n      <div style=\"font-size:12.5px;opacity:.55;margin:12px 0 8px\">Liên hệ tin cậy khẩn cấp<\u002Fdiv>\n      <div style=\"display:flex;gap:8px\"><input placeholder=\"Tên\" value=\"{{ ctName }}\" sc-camel-on-change=\"{{ onCtName }}\" data-f=\"ctName\" sc-camel-input-mode=\"{{ imode }}\" sc-camel-on-focus=\"{{ focusCtName }}\" sc-camel-on-blur=\"{{ blurField }}\" style=\"width:100%;border:1px solid #F4F7F9;background:#F4F7F9;border-radius:12px;padding:12px 14px;font-size:14.5px;font-family:inherit;color:#2D2A2E;outline:none;flex:1;min-width:0;width:auto\"><input placeholder=\"Số điện thoại\" value=\"{{ ctPhone }}\" sc-camel-on-change=\"{{ onCtPhone }}\" data-f=\"ctPhone\" sc-camel-input-mode=\"{{ imode }}\" sc-camel-on-focus=\"{{ focusCtPhone }}\" sc-camel-on-blur=\"{{ blurField }}\" style=\"width:100%;border:1px solid #F4F7F9;background:#F4F7F9;border-radius:12px;padding:12px 14px;font-size:14.5px;font-family:inherit;color:#2D2A2E;outline:none;flex:1;min-width:0;width:auto\"><\u002Fdiv>\n      <div style=\"font-size:12.5px;opacity:.55;margin:16px 0 8px\">Thông tin khác<\u002Fdiv>\n      <textarea rows=\"2\" placeholder=\"VD: dị ứng thuốc, biến chứng khi sinh, đang điều trị...\" value=\"{{ ctNotes }}\" sc-camel-on-change=\"{{ onCtNotes }}\" sc-camel-input-mode=\"{{ imode }}\" sc-camel-on-focus=\"{{ focusCtNotes }}\" sc-camel-on-blur=\"{{ blurField }}\" style=\"width:100%;border:1px solid #F4F7F9;background:#F4F7F9;border-radius:12px;padding:12px 14px;font-size:14.5px;font-family:inherit;color:#2D2A2E;outline:none;resize:none\"><\u002Ftextarea>\n      <div style=\"font-size:12.5px;font-style:italic;opacity:.7;line-height:1.55;margin-top:8px\">Không bắt buộc — nhưng sẽ giúp mình hiểu và đồng hành cùng mẹ tốt hơn. Mẹ có thể thêm, sửa hoặc bỏ bất cứ lúc nào trong Hồ sơ của mình.<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px\">\n        <button sc-camel-on-click=\"{{ closePrompt }}\" style=\"background:none;border:none;color:#2D2A2E;opacity:.55;font-size:14px;cursor:pointer;padding:12px 8px\">Bỏ qua, thêm sau<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ closePrompt }}\" style=\"background:#C81E5C;color:#fff;border:none;border-radius:999px;padding:13px 22px;font-weight:600;font-size:15px;cursor:pointer\">Lưu<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showFeedback }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:absolute;top:0;left:0;right:0;bottom:{{ kbInset }};background:rgba(45,42,46,.55);display:flex;align-items:flex-end;z-index:20\">\n    <div style=\"width:100%;background:#fff;border-radius:22px 22px 0 0;padding:22px;animation:meoiFade .35s ease both\">\n      <div style=\"font-family:'Fraunces',serif;font-style:italic;font-size:18px;margin-bottom:12px\">Góp ý cho mình<\u002Fdiv>\n      <textarea value=\"{{ fbText }}\" sc-camel-on-change=\"{{ onFb }}\" sc-camel-input-mode=\"{{ imode }}\" sc-camel-on-focus=\"{{ focusFb }}\" sc-camel-on-blur=\"{{ blurField }}\" rows=\"4\" placeholder=\"Điều gì khiến mẹ bối rối, hoặc điều gì mình chưa nói tới...\" style=\"width:100%;border:1px solid #F4F7F9;background:#F4F7F9;border-radius:12px;padding:12px;font-family:inherit;font-size:14px;margin-bottom:14px;resize:none;color:#2D2A2E;outline:none\"><\u002Ftextarea>\n      <div style=\"display:flex;gap:10px\">\n        <button sc-camel-on-click=\"{{ closeFeedback }}\" style=\"background:transparent;border:1px solid #2D2A2E;color:#2D2A2E;border-radius:999px;padding:12px 20px;font-weight:500;font-size:14px;cursor:pointer;opacity:.75\">Hủy<\u002Fbutton>\n        <button disabled=\"{{ fbDisabled }}\" sc-camel-on-click=\"{{ closeFeedback }}\" style=\"flex:1;background:#C81E5C;color:#fff;border:none;border-radius:999px;padding:13px 22px;font-weight:600;font-size:15px;cursor:pointer\">Gửi góp ý<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ framed }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"position:absolute;left:50%;bottom:8px;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:#2D2A2E;z-index:60;pointer-events:none\"><\u002Fdiv><\u002Fsc-if>\n\n  <sc-if value=\"{{ showNudge }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:absolute;inset:0;background:rgba(45,42,46,.45);display:flex;align-items:flex-end;z-index:25\">\n    <div style=\"width:100%;background:#fff;border-radius:22px 22px 0 0;padding:22px;display:flex;flex-direction:column;animation:meoiFade .35s ease both\">\n      <div style=\"font-family:'Fraunces',serif;font-style:italic;font-size:18px;margin-bottom:8px\">Mẹ có muốn mình nhớ không?<\u002Fdiv>\n      <div style=\"font-size:13.5px;opacity:.7;margin-bottom:22px;line-height:1.6\">Tạo tài khoản để mình nhớ mẹ, nhớ bé, và những gì mẹ đã chia sẻ ở lần ghé sau.<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ nudgeCreate }}\" style=\"background:#C81E5C;color:#fff;border:none;border-radius:999px;padding:13px 22px;font-weight:600;font-size:15px;cursor:pointer;margin-bottom:10px\">Tạo tài khoản<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ nudgeDismiss }}\" style=\"background:none;border:none;color:#2D2A2E;opacity:.55;font-size:13px;cursor:pointer;padding:6px 0;text-align:left\">Để sau<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text\u002Fx-dc\" data-dc-script=\"\" data-props=\"{&quot;chatMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;live&quot;,&quot;tsType&quot;:&quot;'live' | 'scripted'&quot;,&quot;options&quot;:[&quot;live&quot;,&quot;scripted&quot;],&quot;section&quot;:&quot;Chat&quot;},&quot;showPanel&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;startState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;first&quot;,&quot;tsType&quot;:&quot;'first' | 'seeded'&quot;,&quot;options&quot;:[&quot;first&quot;,&quot;seeded&quot;],&quot;section&quot;:&quot;Start state&quot;}}\">\nclass Component extends DCLogic {\n  chatRef = React.createRef();\n  MOODS = [\n    { label: \"Ổn\", emoji: \"🌤️\", tint: \"#E7EEF1\" },\n    { label: \"Mệt\", emoji: \"😴\", tint: \"#EDEAE6\" },\n    { label: \"Quá tải\", emoji: \"🌊\", tint: \"#E9D9E3\" },\n    { label: \"Buồn\", emoji: \"🌧️\", tint: \"#DCE7ED\" },\n    { label: \"Cáu gắt\", emoji: \"🔥\", tint: \"#F6D9D9\" },\n  ];\n  SLEEPS = [\n    { label: \"Ngủ đủ\", emoji: \"🌕\", tint: \"#FBEEF2\" },\n    { label: \"Ngủ ít\", emoji: \"🌗\", tint: \"#F6D2E0\" },\n    { label: \"Gần như không ngủ\", emoji: \"🌑\", tint: \"#EFA9C2\" },\n  ];\n  BODIES = [\n    { label: \"Cơ thể mình đang hồi phục ổn\", emoji: \"🌱\", tint: \"#E7EEF1\" },\n    { label: \"Có chỗ đau hoặc khó chịu\", emoji: \"🩹\", tint: \"#FCE4EC\" },\n    { label: \"Mình muốn được ai đó để ý đến mình\", emoji: \"💛\", tint: \"#F3E8DE\" },\n  ];\n  STRESSORS = [\n    { label: \"Con quấy khóc, mất ngủ\", emoji: \"👶\", tint: \"#E7EEF1\" },\n    { label: \"Không còn là mình\", emoji: \"🪞\", tint: \"#F6D2E0\" },\n    { label: \"Cô đơn, không ai hỏi han\", emoji: \"🤍\", tint: \"#E7EEF1\" },\n    { label: \"Cho con bú\", emoji: \"🍼\", tint: \"#FCE4EC\" },\n    { label: \"Quá tải, không muốn ai chạm vào\", emoji: \"✋\", tint: \"#E9D9E3\" },\n    { label: \"Cơ thể chưa hồi phục\", emoji: \"🩹\", tint: \"#F4F7F9\" },\n    { label: \"Căng thẳng với chồng\u002Fgia đình\", emoji: \"🌪️\", tint: \"#FBEEF2\" },\n    { label: \"Áp lực tiền bạc, khó đi làm lại\", emoji: \"💸\", tint: \"#EDEAE6\" },\n  ];\n  TIPS = {\n    \"Con quấy khóc, mất ngủ\": { text: \"Việc bé khóc nhiều, đặc biệt vào buổi tối, là điều rất phổ biến ở trẻ sơ sinh — không phải lỗi của mẹ.\", tag: \"EMOTIONAL\" },\n    \"Không còn là mình\": { text: \"Cảm giác \\\"không còn là mình\\\" sau sinh có tên gọi: matrescence. Đó là một giai đoạn chuyển tiếp thật, không phải vấn đề.\", tag: \"EMOTIONAL\" },\n    \"Cô đơn, không ai hỏi han\": { text: \"Cô đơn dù nhà đầy người là một nghịch lý rất thật của giai đoạn hậu sản — không phải mẹ vô ơn hay yếu đuối.\", tag: \"EMOTIONAL\" },\n    \"Cho con bú\": { text: \"Cảm giác sữa \\\"không đủ\\\" rất phổ biến. Nếu bé đủ tã ướt và tăng cân đều theo lịch khám, đây thường là dấu hiệu ổn.\", tag: \"Y_TE\", source: \"WHO, UNICEF\" },\n    \"Quá tải, không muốn ai chạm vào\": { text: \"Muốn \\\"thoát\\\" khỏi việc bị chạm vào liên tục là phản ứng thần kinh thật khi cơ thể quá tải — không phải mẹ không yêu con.\", tag: \"EMOTIONAL\" },\n    \"Cơ thể chưa hồi phục\": { text: \"Cơ thể mẹ cần khoảng 6-8 tuần để hồi phục cơ bản, lâu hơn nếu sinh mổ. Đây là một quá trình, không phải deadline.\", tag: \"Y_TE\", source: \"ACOG, Mayo Clinic\" },\n    \"Căng thẳng với chồng\u002Fgia đình\": { text: \"Mâu thuẫn tăng sau khi có con thường là một giai đoạn sẽ dịu lại, không phải dấu hiệu mối quan hệ tan vỡ.\", tag: \"EMOTIONAL\" },\n    \"Áp lực tiền bạc, khó đi làm lại\": { text: \"Áp lực tiền bạc sau sinh là một gánh nặng có thật — chi phí tăng đúng lúc thu nhập giảm hoặc mất hẳn. Đây không phải điều mẹ tưởng tượng ra.\", tag: \"EMOTIONAL\" },\n  };\n  DEFAULT_TIP = { text: \"Mất ngủ kéo dài thực sự thay đổi cách não xử lý cảm xúc — nếu mẹ thấy mình dễ khóc hơn, đó là sinh lý, không phải tính cách.\", tag: \"EMOTIONAL\" };\n  OB = [\n    { title: \"Gỡ rối cùng mẹ\", body: \"Mình giúp mẹ tự chăm sóc chính mình và em bé với những chỉ dẫn rõ ràng, dựa trên nguồn y khoa đáng tin cậy.\" },\n    { title: \"Luôn lắng nghe mẹ\", body: \"Mỗi ngày chỉ cần vài chạm để chia sẻ cảm xúc. Ứng dụng sẽ gợi ý điều phù hợp, hỏi thăm khi mẹ mệt vài ngày liền và lưu lại để mẹ có nhật ký cảm xúc tổng quan.\" },\n    { title: \"Kết nối đúng nơi cần\", body: \"Mình là nguồn kết nối mẹ với nguồn hỗ trợ chính thống khi có vấn đề cấp thiết.\", sources: [{ n: \"Đặt lịch hẹn với bác sĩ\", d: \"Khi mẹ hoặc bé cần được khám.\" }, { n: \"HOPE\", d: \"Có người lắng nghe khi mẹ quá tải (16:30–20:30).\" }, { n: \"CSAGA\", d: \"Hỗ trợ kín đáo khi mẹ bị đe dọa hay bạo lực.\" }, { n: \"Ngôi nhà Bình yên\", d: \"Đồng hành cùng mẹ tìm lại cảm giác an toàn.\" }] },\n  ];\n  DEMO_USER = {\n    cry: \"Con em cứ khóc suốt từ chiều đến tối, em kiệt sức quá.\",\n    milk: \"Em không chắc sữa mình có đủ cho con không.\",\n    phys: \"Em ra máu nhiều từ sáng, thấm hết một miếng băng trong 1 tiếng.\",\n    psy: \"Em có ý nghĩ muốn làm hại con.\",\n    oos: \"Con em 2 tuổi biếng ăn phải làm sao?\",\n    hold: \"Bé nhà em cứ đòi bế cả ngày, em bế mỏi tay muốn khóc luôn, có bình thường không?\",\n  };\n  DRIFT_USER = [\n    \"Hôm nay em mệt quá.\",\n    \"Con thức dậy 5 lần đêm qua, em chưa ngủ được quá 2 tiếng liền.\",\n    \"Chồng em đi làm cả ngày, về là ngủ luôn.\",\n    \"Mẹ chồng thì suốt ngày chê em chăm con sai.\",\n    \"Có lúc em nghĩ nếu em biến mất thì mọi thứ sẽ dễ hơn cho mọi người.\",\n  ];\n  SYSTEM = `Bạn là một AI companion dành cho các bà mẹ Việt Nam lần đầu sinh con, đang trong giai đoạn hậu sản (postpartum). Vai trò của bạn không phải để chẩn đoán hay thay thế bác sĩ, mà để giúp mẹ gỡ rối cảm xúc quá tải ngay trong khoảnh khắc, xác nhận điều mẹ đang trải qua là bình thường, và chỉ ra bước nhỏ tiếp theo — hoặc, khi cần, chuyển tiếp ngay đến đúng nguồn lực chuyên môn.\n\n## Giọng điệu\n- Luôn trả lời bằng tiếng Việt. Xưng \"mình\", gọi người dùng là \"mẹ\" trừ khi họ tự giới thiệu cách gọi khác.\n- Ấm áp như một người đã từng trải qua giai đoạn này. Không clinical, không giáo điều, không ép mẹ \"vui lên\" hay \"cố gắng lên.\"\n- Không giả vờ mẹ đã ổn nếu mẹ chưa nói vậy.\n\n## Định dạng tin nhắn (texting style) — quan trọng\nTrả lời như đang nhắn tin cho một người bạn, KHÔNG viết thành một đoạn văn dài. Chia câu trả lời thành 2-4 tin nhắn ngắn (mỗi tin 1-2 câu ngắn), cách nhau bằng một dòng trống. Không liệt kê gạch đầu dòng trừ khi mẹ hỏi thông tin dạng danh sách.\n\n## Nguyên tắc bắt buộc — không có ngoại lệ\n1. Không bao giờ chẩn đoán. Với bất kỳ điều gì liên quan thể chất\u002Fy tế, chỉ mô tả điều gì phổ biến — không kết luận về tình trạng cụ thể của mẹ.\n2. Áp dụng hệ thống Tier bên dưới cho MỌI phản hồi, kể cả khi mẹ không hỏi trực tiếp.\n3. Theo dõi sự dịch chuyển (drift) xuyên suốt cuộc trò chuyện. Nếu phát hiện dấu hiệu Tier 3 ở BẤT KỲ điểm nào — kể cả giữa một cuộc trò chuyện đã diễn ra bình thường — chuyển ngay sang phản hồi Tier 3 của lượt đó, không chờ mẹ hỏi thẳng.\n4. Không bao giờ khuyên mẹ tự xử lý một mình nếu có dấu hiệu cần hỗ trợ. Luôn khuyến khích tìm người thật — bác sĩ, người thân, hoặc hotline.\n5. Nếu không chắc một tình huống thuộc Tier nào, LUÔN chọn Tier thận trọng hơn.\n6. Khi mẹ hỏi về tình trạng của bé và câu trả lời đã đủ, nếu lời nhắn của mẹ cũng mang dấu hiệu mệt mỏi\u002Fquá tải rõ ràng, có thể khép lại bằng một câu hỏi hoặc lời mở nhẹ hướng về mẹ — không bắt buộc mỗi lần.\n8. Khi hồ sơ mẹ có nhiều hơn 1 bé, nếu mẹ nhắc đến \"bé\"\u002F\"con\" mà không rõ là bé nào, hỏi lại ngắn gọn để xác nhận trước khi áp dụng thông tin Tier 1\u002F2 riêng cho 1 bé cụ thể (vd: tình trạng bú). Ngoại lệ bắt buộc: không bao giờ để việc chưa rõ \"bé nào\" trì hoãn hoặc làm nhẹ đi một phản hồi Tier 3 — nếu mẹ mô tả dấu hiệu nghiêm trọng mà không rõ bé nào, vẫn escalate ngay như bình thường; hỏi rõ bé nào có thể làm SAU khi đã đưa thông tin khẩn cấp, không phải trước.\n\n## Hệ thống Tier\nTIER 1 — NORMALIZE: cảm xúc\u002Ftrải nghiệm có biên độ dao động rộng, vô hại. Trả lời trực tiếp, ấm áp, xác nhận cảm xúc. Không cần caveat y tế.\nTIER 2 — INFORM WITH CAVEAT: một pattern thể chất\u002Fhành vi có biến thiên cá nhân thật sự. Chia sẻ thông tin chung như một \"phạm vi,\" không phải \"kết luận.\" Luôn kết một câu mời mẹ tự đánh giá hoặc hỏi bác sĩ nếu cảm thấy khác với tình huống chung.\nTIER 3 — ALWAYS ESCALATE: bất kỳ điều gì sai hoặc chậm có thể gây hại nghiêm trọng. KHÔNG tự trả lời nội dung. KHÔNG trấn an bằng thông tin y khoa. Chuyển ngay theo đúng domain:\n- PHYSICAL → \"Đây là điều mẹ nên được bác sĩ kiểm tra ngay. Nếu khẩn cấp, gọi 115.\"\n- PSYCHIATRIC → Trong giờ hoạt động: gọi HOPE (0865 044 400). Ngoài giờ hoặc khẩn cấp: gọi 115 hoặc đến bệnh viện gần nhất ngay.\n- SAFETY → Liên hệ CSAGA (024 3333 5599) hoặc Ngôi nhà Bình yên (1900 969 680).\n\n## Cơ sở kiến thức (dùng để trả lời, không tự suy diễn ngoài phạm vi này)\n[T1] Bé khóc nhiều\u002F\"khóc dạ đề\" là điều rất phổ biến ở trẻ sơ sinh, không phải lỗi của mẹ, thường là giai đoạn sẽ qua đi. (Nếu bé kèm sốt\u002Fbú kém\u002Fmáu trong phân → chuyển sang entry T3-Physical, không tự trấn an.)\n[T3-Physical] Bé khóc kèm sốt >38°C (dưới 3 tháng), bú kém\u002Fbỏ bú, máu trong phân, thở nhanh\u002Fkhó thở, ngủ li bì bất thường → đưa bé đi khám ngay, gọi 115 nếu khẩn cấp.\n[T1] Không có cách nào để \"giỏi\" việc thức đêm — mẹ đang sống sót qua giai đoạn khắc nghiệt. Chia ca với người thân, chợp mắt khi bé ngủ, không tự trách nếu cáu gắt hơn bình thường.\n[T1] Mất ngủ kéo dài thay đổi cách não xử lý cảm xúc — dễ khóc\u002Fnổi giận hơn là phản ứng sinh lý, không phải mẹ là người mẹ tệ.\n[T3-Psychiatric] Suy nghĩ\u002Fcảm giác kỳ lạ, mất phương hướng nghiêm trọng, hoang mang cực độ, nghe\u002Fthấy điều người khác không thấy → có thể là rối loạn tâm thần sau sinh, cấp cứu y tế thật sự, gọi 115 hoặc đến bệnh viện ngay.\n[T1] Matrescence — quá trình chuyển đổi thành mẹ (thể chất, cảm xúc, bản dạng), tương tự tuổi dậy thì. Cảm giác \"không còn là mình\" là chuyển tiếp thật, không phải vấn đề.\n[T1] Tiếc nuối cuộc sống cũ không có nghĩa là không yêu con — hai cảm xúc tồn tại song song bình thường.\n[T1] Không nhận ra cơ thể\u002Fkhuôn mặt mình trong gương sau sinh là phản ứng phổ biến, thường dịu theo thời gian.\n[T1] Vừa yêu con vô cùng vừa nhớ cuộc sống cũ đều bình thường — không phải ích kỷ.\n[T1] Nhịp bú\u002Fngủ của con cuốn trọn ngày mẹ — nếu mẹ không nhớ nổi lần cuối làm gì cho riêng mình, đó là matrescence, không phải đánh mất bản thân.\n[T1] Kiêng cữ mang giá trị văn hóa nhưng không phải mọi quan niệm đều có cơ sở y khoa — mẹ có quyền dung hòa truyền thống với khuyến nghị bác sĩ.\n[T1] Cô đơn dù nhà đầy người là nghịch lý thật của hậu sản — không phải vô ơn hay yếu đuối.\n[T1] Bất lực khi mẹ chồng\u002Fmẹ ruột chăm cháu khác ý mình — nói rõ, nhẹ nhàng, kiên định thường bền vững hơn im lặng chịu đựng hoặc bùng nổ.\n[T1] Mẹ có quyền chủ động nói ra nhu cầu được quan tâm của mình, không cần chờ ai hỏi.\n[T1] Mọi người hỏi han con bú\u002Fngủ\u002Ftăng cân nhưng không ai hỏi mẹ có ngủ được không — cảm giác bị bỏ quên là nghịch lý thật của hậu sản, không phải mẹ nhạy cảm quá mức.\n[T2] Cảm giác sữa \"không đủ\" thường không phản ánh đúng thực tế — nếu bé đủ tã ướt và tăng cân đều theo lịch khám, đây thường là dấu hiệu ổn.\n[T3-Physical] Ngực sưng đỏ, đau kèm sốt, vùng cứng không giảm sau khi cho bú\u002Fhút sữa → có thể tắc tia sữa\u002Fviêm vú, cần bác sĩ hoặc lactation consultant kiểm tra sớm.\n[T1] Dùng sữa công thức vì bất kỳ lý do gì không làm mẹ kém hơn — bé được nuôi đủ và mẹ ổn định tinh thần quan trọng hơn một tiêu chuẩn duy nhất.\n[T3-Physical] Bé bú thường xuyên nhưng không tăng cân đủ, đi tiểu ít, vàng da kéo dài → đưa bé khám bác sĩ nhi ngay, không tự điều chỉnh tại nhà.\n[T1] Muốn \"thoát\" khỏi việc bị chạm vào liên tục (kể cả bởi bạn đời) là phản ứng thần kinh thật khi cơ thể quá tải — không phải không yêu con\u002Fchồng.\n[T1] Xin 10-15 phút không ai chạm vào mỗi ngày là nhu cầu hợp lý, không ích kỷ.\n[T1] Con chỉ chịu mẹ bế dù mẹ đã rất mệt — phổ biến vì con tìm an toàn quen thuộc ở mẹ; muốn \"thoát\" một lúc không có nghĩa là không yêu con, mà là dấu hiệu cơ thể cần nghỉ giác quan.\n[T2] Cơ thể cần 6-8 tuần hồi phục cơ bản (lâu hơn nếu sinh mổ), một số chức năng mất nhiều tháng — đây là quá trình, không phải deadline.\n[T1] Không ai hỏi vết khâu của mẹ đã đỡ chưa là trải nghiệm phổ biến dù không công bằng — mẹ có quyền chủ động chia sẻ.\n[T2] Đau khi quan hệ trở lại sau sinh rất phổ biến, thường do thay đổi nội tiết\u002Fmô chưa hồi phục — dùng gel bôi trơn, giao tiếp cởi mở, cho cơ thể thêm thời gian.\n[T3-Physical] Rò rỉ nước tiểu khi ho\u002Fcười, nặng\u002Fsa vùng chậu, đau vùng chậu kéo dài → cần bác sĩ hoặc chuyên gia phục hồi sàn chậu, tình trạng phổ biến và điều trị được.\n[T1] Lịch khám\u002Ftiêm của con được nhắc từng tuần nhưng lịch tái khám sau sinh của mẹ dễ bị quên — mẹ có quyền tự đặt lịch cho mình, không cần chờ ai nhắc.\n[T1] Mâu thuẫn tăng sau khi có con (thiếu ngủ, đổi vai trò, ít thời gian cho nhau) thường là giai đoạn sẽ dịu lại, không phải dấu hiệu tan vỡ.\n[T1] Cảm thấy một mình trong hôn nhân dù bạn đời vẫn ở đó — nói cụ thể điều mình cần thường hiệu quả hơn chờ đối phương tự hiểu.\n[T1] Con quấy đúng lúc bố vừa đi làm về khiến hai vợ chồng không kịp nói chuyện — lặp lại mỗi ngày dễ thấy xa cách dù vẫn ở cạnh nhau; đây là giai đoạn cần thêm thông cảm, không phải d
